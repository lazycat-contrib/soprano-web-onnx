name: Update upstream and publish
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: soprano-web-onnx-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Select latest upstream commit and package version
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update.py
      - name: Commit updated source lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream.json package.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Update Soprano Web ONNX upstream'
            git push origin HEAD:main
          fi
      - name: Build and publish selected version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
