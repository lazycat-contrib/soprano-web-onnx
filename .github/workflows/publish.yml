name: Build and publish to MiaoMiao
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: soprano-web-onnx-publish
  cancel-in-progress: false
jobs:
  release-state:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release.outputs.exists }}
      version: ${{ steps.release.outputs.version }}
      name: ${{ steps.release.outputs.name }}
      url: ${{ steps.release.outputs.url }}
      sha256: ${{ steps.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py
  publish:
    needs: release-state
    if: needs.release-state.outputs.exists != 'true'
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      versioned-release-asset: true
      toolchains: node
      node-version: 24.x
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
  reconcile:
    needs: release-state
    if: needs.release-state.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify existing LPK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-state.outputs.version }}
          ASSET_NAME: ${{ needs.release-state.outputs.name }}
          EXPECTED_SHA256: ${{ needs.release-state.outputs.sha256 }}
        run: |
          mkdir -p .lazycat-build
          gh release download "v$VERSION" --pattern "$ASSET_NAME" --dir .lazycat-build
          printf '%s  %s\n' "$EXPECTED_SHA256" ".lazycat-build/$ASSET_NAME" | sha256sum --check
      - name: Reconcile MiaoMiao publication
        uses: ca-x/lazycat-github-action@v1
        env:
          APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
        with:
          operation: publish-private
          config: .github/lazycat-action.yml
          version: ${{ needs.release-state.outputs.version }}
          lpk-path: .lazycat-build/${{ needs.release-state.outputs.name }}
          download-url: ${{ needs.release-state.outputs.url }}
          sha256: ${{ needs.release-state.outputs.sha256 }}
